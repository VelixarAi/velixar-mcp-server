name: Memory Summarization

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  summarize:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ⚠️ UNTRUSTED INPUT GOES THROUGH `env:`, NEVER `${{ }}` INTERPOLATION INTO `run:`.
      #
      # This step used to expand `${{ github.event.pull_request.title }}` and `.body`
      # directly into the shell script. A PR title containing backticks or $(...) executes
      # arbitrary code on the runner, with the repo token in scope — the classic Actions
      # script-injection. It also explains the one historical failure: a title carrying a
      # quote or newline breaks the assignment before anything else runs.
      #
      # Passing them as environment variables makes them DATA. The shell never parses them.
      - name: Collect PR context
        id: context
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          FILES_CHANGED=$(git diff --name-only "$BASE_SHA".."$HEAD_SHA" | head -30)
          N_FILES=$(printf '%s\n' "$FILES_CHANGED" | grep -c . || true)

          {
            printf 'summary<<VELIXAR_EOF\n'
            printf 'PR #%s: %s\n' "$PR_NUMBER" "$PR_TITLE"
            if [ -n "${PR_BODY:-}" ]; then
              printf '\n%s\n' "$(printf '%s' "$PR_BODY" | head -c 500)"
            fi
            printf '\nFiles: %s changed\n' "$N_FILES"
            printf 'VELIXAR_EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Store summarized memory
        # `env.VELIXAR_API_KEY` here read the JOB env, not this step's own `env:`
        # block — so it was always empty and this step has NEVER run. Test the secret.
        if: ${{ secrets.VELIXAR_API_KEY != '' }}
        env:
          VELIXAR_API_KEY: ${{ secrets.VELIXAR_API_KEY }}
          VELIXAR_API_URL: ${{ secrets.VELIXAR_API_URL }}
          VELIXAR_WORKSPACE_ID: ${{ secrets.VELIXAR_WORKSPACE_ID }}
        run: |
          curl -s -X POST "${VELIXAR_API_URL}/memory" \
            -H "Authorization: Bearer ${VELIXAR_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg content "${{ steps.context.outputs.summary }}" \
              --arg workspace "$VELIXAR_WORKSPACE_ID" \
              '{content: $content, tier: 2, tags: ["ci", "pr-merge", "automated"], workspace_id: $workspace}')" \
            | jq '.id // "stored"'
